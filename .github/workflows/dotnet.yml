name: "Deploy packages"
on:
  push:
    paths-ignore:
      - "LlmRuntime/**"
      - "LlmRuntime.Tests/**"
      - "LlmRuntime.Wpf/**"
      - "heirowLLMBridgeInstaller/**"
      - "heirowLLM/**"
      - "heirowLLMInstaller/**"
      - "heirowLLMUpdater/**"
      - "SocketJack-MagicMasterList/**"
      - "artifacts/heirowLLM/**"

permissions:
  contents: read

jobs:
 linux-build:
    name: "Linux build"
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@v4

    - name: "Setup .NET"
      uses: actions/setup-dotnet@v4
      with:
         dotnet-version: "10.0.x"

    - name: "Restore SocketJack"
      run: dotnet restore ./SocketJack/SocketJack.csproj

    - name: "Build SocketJack"
      run: dotnet build ./SocketJack/SocketJack.csproj --configuration Release --framework netstandard2.1 --no-restore -p:NoWarn=true

#    - name: "Restore SocketJack.WPF"
#      run: dotnet restore ./SocketJack.Windows/SocketJack.WPF.csproj

#    - name: "Build SocketJack.WPF"
#     run: dotnet build ./SocketJack.Windows/SocketJack.WPF.csproj --configuration Release --no-restore -p:NoWarn=true

#    - name: "Publish Linux heirowLLM Workstation"
#      run: dotnet publish ./heirowLLM.Workstation/heirowLLM.Workstation.csproj --configuration Release --runtime linux-x64 --self-contained false -p:NoWarn=true

 deploy:
    name: "Deploy"
    runs-on: windows-latest
    needs: linux-build
    permissions:
      contents: read
      packages: write
    steps:
    - name: "Checkout"
      uses: actions/checkout@v4

    - name: "Setup .NET"
      uses: actions/setup-dotnet@v4
      with:
         dotnet-version: "10.0.x"

    - name: "Restore dependencies"
      run: dotnet restore ./SocketJack/SocketJack.csproj

    - name: "Build"
      run: dotnet build ./SocketJack/SocketJack.csproj --configuration Release --no-restore -p:NoWarn=true

    - name: "Pack Project"
      run: dotnet pack ./SocketJack/SocketJack.csproj --configuration Release --no-build --include-symbols -o ./nupkg/SocketJack

#    - name: "Restore WPF dependencies"
#      run: dotnet restore ./SocketJack.Windows/SocketJack.WPF.csproj

#    - name: "Build WPF"
#      run: dotnet build ./SocketJack.Windows/SocketJack.WPF.csproj --configuration Release --no-restore -p:NoWarn=true

#    - name: "Restore WPF sample app"
#      run: dotnet restore ./SocketJack.WpfBasicGame/SocketJack.WpfBasicGame.csproj

#    - name: "Build WPF sample app"
#      run: dotnet build ./SocketJack.WpfBasicGame/SocketJack.WpfBasicGame.csproj --configuration Release --no-restore -p:NoWarn=true

#    - name: "Pack WPF Project"
#      run: dotnet pack ./SocketJack.Windows/SocketJack.WPF.csproj --configuration Release --no-build --include-symbols -o ./nupkg/SocketJack.WPF

    - name: "Push SocketJack to NuGet"
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        $packages = @(Get-ChildItem -Path ./nupkg/SocketJack -Filter 'SocketJack*.nupkg' |
          Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
          Select-Object -ExpandProperty FullName)
        if ($packages.Count -ne 1) {
          throw "Expected exactly one SocketJack package, found $($packages.Count)."
        }
        dotnet nuget push $packages[0] --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

#    - name: "Push SocketJack.WPF to NuGet"
#      shell: pwsh
#      env:
#        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
#      run: |
#        $packages = @(Get-ChildItem -Path ./nupkg/SocketJack.WPF -Filter 'SocketJack.WPF*.nupkg' |
#          Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
#          Select-Object -ExpandProperty FullName)
#        if ($packages.Count -ne 1) {
#          throw "Expected exactly one SocketJack.WPF package, found $($packages.Count)."
#        }
#        dotnet nuget push $packages[0] --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: "Add GitHub Packages source"
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet nuget add source --username "${{ github.actor }}" --password "$env:GITHUB_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

    - name: "Push SocketJack to GitHub Packages"
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        Get-ChildItem -Path ./nupkg/SocketJack -Filter 'SocketJack*.nupkg' |
          Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
          ForEach-Object {
            dotnet nuget push $_.FullName --source github --api-key $env:GITHUB_TOKEN --skip-duplicate
          }

