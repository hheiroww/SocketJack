name: Deploy packages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Build and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Restore and audit dependencies
        run: dotnet restore SocketJack/SocketJack.csproj
      - name: Build library
        run: dotnet build SocketJack/SocketJack.csproj -c Release --no-restore -p:BuildPackage=false
      - name: Verify security and package boundaries
        run: dotnet test SocketJack.Tests/SocketJack.Tests.csproj -c Release -p:BuildPackage=false
      - name: Verify reliable transport and codec
        run: dotnet test SocketJack.UdpReliable.Tests/SocketJack.UdpReliable.Tests.csproj -c Release -p:BuildPackage=false --filter "TestCategory!=LargeFile"
  deploy:
    name: Publish verified library
    runs-on: windows-latest
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"
    - name: Restore and audit dependencies
      run: dotnet restore SocketJack/SocketJack.csproj
    - name: Pack library
      run: dotnet pack SocketJack/SocketJack.csproj -c Release -p:BuildPackage=false --no-restore -o ./nupkg/SocketJack
    - name: "Login to NuGet with Trusted Publishing"
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: Pathogenix

    - name: "Push SocketJack to NuGet"
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        $packages = @(Get-ChildItem -Path ./nupkg/SocketJack -Filter 'SocketJack*.nupkg' |
          Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
          Select-Object -ExpandProperty FullName)
        if ($packages.Count -ne 1) {
          throw "Expected exactly one SocketJack package, found $($packages.Count)."
        }
        dotnet nuget push $packages[0] --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: "Add GitHub Packages source"
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet nuget add source --username "${{ github.actor }}" --password "$env:GITHUB_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

    - name: "Push SocketJack to GitHub Packages"
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        Get-ChildItem -Path ./nupkg/SocketJack -Filter 'SocketJack*.nupkg' |
          Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
          ForEach-Object {
            dotnet nuget push $_.FullName --source github --api-key $env:GITHUB_TOKEN --skip-duplicate
          }
