name: Deploy packages
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      releaseTarget:
        description: Package family to validate and publish
        type: choice
        required: true
        default: core
        options: [core, unity]
permissions:
  contents: read
concurrency:
  group: socketjack-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.releaseTarget != 'unity'
    name: Build and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Restore and audit dependencies
        run: dotnet restore SocketJack/SocketJack.csproj
      - name: Build library
        run: dotnet build SocketJack/SocketJack.csproj -c Release --no-restore -p:BuildPackage=false
      - name: Verify security and package boundaries
        run: dotnet test SocketJack.Tests/SocketJack.Tests.csproj -c Release -p:BuildPackage=false
      - name: Verify reliable transport and codec
        run: dotnet test SocketJack.UdpReliable.Tests/SocketJack.UdpReliable.Tests.csproj -c Release -p:BuildPackage=false --filter "TestCategory!=LargeFile"
      - name: Verify SecurityLoader facade boundaries
        run: dotnet test SocketJack.SecurityLoader.Tests/SocketJack.SecurityLoader.Tests.csproj -c Release -p:BuildPackage=false
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.releaseTarget != 'unity'
    name: Publish verified packages
    runs-on: windows-latest
    needs: validate
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
          8.0.x
    - name: Validate release date and unused package version
      shell: pwsh
      run: |
        ./tools/Verify-ReleaseVersion.ps1
        ./tools/Verify-ReleaseVersion.ps1 -Project ./SocketJack.Windows/SocketJack.WPF.csproj -PackageId SocketJack.WPF
    - name: Restore and audit dependencies
      run: |
        dotnet restore SocketJack/SocketJack.csproj
        dotnet restore SocketJack.Windows/SocketJack.WPF.csproj
    - name: Pack libraries
      run: |
        dotnet pack SocketJack/SocketJack.csproj -c Release -p:BuildPackage=false -p:RepositoryCommit=${{ github.sha }} --no-restore -o ./nupkg/SocketJack
        dotnet pack SocketJack.Windows/SocketJack.WPF.csproj -c Release -p:BuildPackage=false -p:GeneratePackageOnBuild=false -p:RepositoryCommit=${{ github.sha }} --no-restore -o ./nupkg/SocketJack.WPF
    - name: Verify release package allowlist and checksums
      shell: pwsh
      run: |
        $packages = @(./tools/Get-ReleasePackages.ps1)
        $checksums = foreach ($package in $packages) {
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($package))"
        }
        $checksums | Set-Content -LiteralPath ./nupkg/SHA256SUMS -Encoding utf8NoBOM
    - name: Preserve verified packages
      uses: actions/upload-artifact@v4
      with:
        name: socketjack-packages-${{ github.sha }}
        path: |
          ./nupkg/SocketJack/*.nupkg
          ./nupkg/SocketJack.WPF/*.nupkg
          ./nupkg/SHA256SUMS
        if-no-files-found: error
    - name: "Login to NuGet with Trusted Publishing"
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: Pathogenix

    - name: "Push SocketJack packages to NuGet"
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        $packages = @(./tools/Get-ReleasePackages.ps1)
        foreach ($package in $packages) {
          dotnet nuget push $package --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw "NuGet publication failed for $([IO.Path]::GetFileName($package))." }
        }

    - name: "Add GitHub Packages source"
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet nuget add source --username "${{ github.actor }}" --password "$env:GITHUB_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

    - name: "Push SocketJack packages to GitHub Packages"
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        foreach ($package in @(./tools/Get-ReleasePackages.ps1)) {
          dotnet nuget push $package --source github --api-key $env:GITHUB_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "GitHub Packages publication failed for $([IO.Path]::GetFileName($package))." }
        }

    - name: Publish GitHub Release with verified package assets
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $ErrorActionPreference = 'Stop'
        [xml]$project = Get-Content -LiteralPath ./SocketJack/SocketJack.csproj -Raw
        $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
        $releaseAssets = @(./tools/Get-ReleasePackages.ps1) + @('./nupkg/SHA256SUMS')
        $notes = @(
          $project.SelectSingleNode('/Project/PropertyGroup/PackageReleaseNotes').InnerText.Trim(),
          '',
          "Includes SocketJack and SocketJack.WPF $version for NuGet and GitHub Packages.",
          '',
          'Download the .nupkg assets below, or install from NuGet:',
          '',
          '```powershell',
          "dotnet add package SocketJack --version $version",
          "dotnet add package SocketJack.WPF --version $version",
          '```',
          '',
          'SHA256SUMS records the SHA-256 digest of each attached package.'
        )
        $notesPath = Join-Path $env:RUNNER_TEMP 'socketjack-release-notes.md'
        $notes | Set-Content -LiteralPath $notesPath -Encoding utf8NoBOM
        gh release create "v$version" @releaseAssets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "SocketJack $version" --notes-file $notesPath --latest
        if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
  unity-validate:
    name: Validate Unity multiplayer package family
    if: github.event_name == 'workflow_dispatch' && inputs.releaseTarget == 'unity'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Test browser voice interoperability bounds without hardware
        run: node tools/Unity.BrowserVoice.Acceptance/test-bridges.mjs
      - name: Install Linux account-store prerequisite
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsqlite3-0
      - name: Test multiplayer and transport contracts
        run: dotnet test SocketJack.Unity.Tests/SocketJack.Unity.Tests.csproj -c Release
      - name: Test accounts, persistence, API, chat, website and relay
        shell: pwsh
        run: |
          dotnet run --project SocketJack.Unity.Web.Tests/SocketJack.Unity.Web.Tests.csproj -c Release -- --staging "${{ runner.temp }}/unity-web-tests"
          if ($LASTEXITCODE -ne 0) { throw 'Web module acceptance failed.' }
      - name: Test Opus voice and authenticated account voice bridges
        shell: pwsh
        env:
          SOCKETJACK_VOICE_TEST_OUTPUT: ${{ runner.temp }}/unity-voice-tests
        run: |
          dotnet test SocketJack.Unity.Voice.Tests/SocketJack.Unity.Voice.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Voice contracts failed.' }
          dotnet test SocketJack.Unity.Voice.Web.Tests/SocketJack.Unity.Voice.Web.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Account voice bridge contracts failed.' }
      - name: Verify shared TCP and UDP reconstruction security
        run: dotnet test SocketJack.Tests/SocketJack.Tests.csproj -c Release -p:BuildPackage=false --filter "FullyQualifiedName~AuthorizationTests|FullyQualifiedName~ObjectRebuilderTests|FullyQualifiedName~BinarySegmentedDecodingTests"
      - name: Pack the explicit six-package Unity family
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          foreach ($spec in @(./tools/Get-UnityPackageFamily.ps1)) {
            dotnet pack $spec.Project -c Release "-p:RepositoryCommit=${{ github.sha }}" -o ./artifacts/unity
            if ($LASTEXITCODE -ne 0) { throw "Packing $($spec.Id) failed." }
          }
          ./tools/Verify-UnityPackageFamily.ps1 -PackageRoot ./artifacts/unity -WriteChecksums
      - name: Test release verification failure cases
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./tools/Test-UnityPackageVerification.ps1 -PackageRoot ./artifacts/unity -OutputDirectory "${{ runner.temp }}/unity-package-verification"
      - name: Exercise 2000 UDP peers
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project tools/Unity.Multiplayer.Bench/Unity.Multiplayer.Bench.csproj -c Release -- 2000 2
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: socketjack-unity-${{ github.sha }}
          path: artifacts/unity/*
          if-no-files-found: error
  unity-deploy:
    name: Publish verified Unity package family
    if: github.event_name == 'workflow_dispatch' && inputs.releaseTarget == 'unity'
    needs: unity-validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: socketjack-unity-${{ github.sha }}
          path: artifacts/unity
      - name: Verify immutable family versions and build payloads
        shell: pwsh
        run: |
          ./tools/Verify-UnityRelease.ps1
          ./tools/Verify-UnityPackageFamily.ps1 -PackageRoot ./artifacts/unity -VerifyChecksums
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Pathogenix
      - name: Publish the verified dependency-ordered family
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          foreach ($spec in @(./tools/Get-UnityPackageFamily.ps1)) {
            $package = Join-Path ./artifacts/unity "$($spec.Id).$($spec.NormalizedVersion).nupkg"
            dotnet nuget push $package --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { throw "NuGet publication failed for $($spec.Id); do not recreate or replace an already published version." }
          }
      - name: Verify every downloadable NuGet payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pending = [Collections.Generic.List[object]]::new()
          foreach ($spec in @(./tools/Get-UnityPackageFamily.ps1)) { $pending.Add($spec) }
          $deadline = [DateTime]::UtcNow.AddMinutes(20)
          while ($pending.Count -gt 0 -and [DateTime]::UtcNow -lt $deadline) {
            foreach ($spec in @($pending.ToArray())) {
              if ([DateTime]::UtcNow -ge $deadline) { break }
              $id = $spec.Id.ToLowerInvariant(); $version = $spec.NormalizedVersion
              $uri = "https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg"
              $download = Join-Path $env:RUNNER_TEMP "$id.$version.feed.nupkg"
              try {
                Invoke-WebRequest $uri -OutFile $download -TimeoutSec 15
                ./tools/Verify-UnityPackage.ps1 -Package $download -ExpectedPackage "./artifacts/unity/$($spec.Id).$version.nupkg"
                $pending.Remove($spec) | Out-Null
              } catch { Write-Host "NuGet download verification pending for $($spec.Id)." }
            }
            if ($pending.Count -gt 0) { Start-Sleep -Seconds 10 }
          }
          if ($pending.Count -gt 0) { throw "Published package downloads not verified: $($pending.Id -join ', ')." }
      - name: Publish the Unity family GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $family = @(./tools/Get-UnityPackageFamily.ps1)
          $version = $family[0].Version
          ./tools/Verify-UnityPackageFamily.ps1 -PackageRoot ./artifacts/unity -VerifyChecksums
          $assets = @($family | ForEach-Object { "./artifacts/unity/$($_.Id).$($_.NormalizedVersion).nupkg" }) + @('./artifacts/unity/SHA256SUMS')
          $notes = Join-Path $env:RUNNER_TEMP 'unity-release.md'
          $lines = @(
            'SocketJack multiplayer runtime with optional accounts, website, chat and voice modules.',
            '',
            'The six packages use one matching version. The base remains dependency-free; install only the optional modules your game needs.',
            ''
          )
          $lines += @($family | ForEach-Object { "- $($_.Id) $version" })
          $lines += @(
            '',
            'Windows and Linux managed tests, account persistence/API acceptance, voice contracts, strict package contents and the Linux 2,000-peer loopback smoke passed before publication.',
            'Loopback checks do not establish production Internet capacity. Unity native/WebGL acceptance is recorded separately in the release documentation.',
            '',
            "See the [Release Two guide](https://github.com/hheiroww/SocketJack/blob/$env:GITHUB_SHA/docs/Unity-ReleaseTwo.md) for installation, module contracts and acceptance boundaries.",
            '',
            'SHA256SUMS records the attached build archive digests. Every NuGet payload was compared entry by entry with its build artifact, excluding only the repository signature.'
          )
          $lines | Set-Content -LiteralPath $notes -Encoding utf8NoBOM
          gh release create "socketjack-unity-v$version" @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "SocketJack.Unity $version" --notes-file $notes --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Unity family GitHub release publication failed.' }
