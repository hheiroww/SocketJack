name: SocketJack.Unity
on:
  push:
    branches: [master, codex/unity-multiplayer]
    tags: [socketjack-unity-v*]
    paths:
      - SocketJack.Unity/**
      - SocketJack.Unity.Tests/**
      - tools/Unity.Multiplayer.Bench/**
      - tools/Verify-UnityRelease.ps1
      - tools/Verify-UnityPackage.ps1
      - .github/workflows/unity.yml
      - .github/workflows/dotnet.yml
  pull_request:
    paths:
      - SocketJack.Unity/**
      - SocketJack.Unity.Tests/**
      - tools/Unity.Multiplayer.Bench/**
      - tools/Verify-UnityRelease.ps1
      - tools/Verify-UnityPackage.ps1
      - .github/workflows/unity.yml
      - .github/workflows/dotnet.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: socketjack-unity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test multiplayer and transport contracts
        run: dotnet test SocketJack.Unity.Tests/SocketJack.Unity.Tests.csproj -c Release
      - name: Verify shared TCP and UDP reconstruction security
        run: dotnet test SocketJack.Tests/SocketJack.Tests.csproj -c Release -p:BuildPackage=false --filter "FullyQualifiedName~AuthorizationTests|FullyQualifiedName~ObjectRebuilderTests|FullyQualifiedName~BinarySegmentedDecodingTests"
      - name: Pack portable Unity library
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack SocketJack.Unity/SocketJack.Unity.csproj -c Release -p:RepositoryCommit=${{ github.sha }} -o ./artifacts/unity
      - name: Exercise 2000 UDP peers
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project tools/Unity.Multiplayer.Bench/Unity.Multiplayer.Bench.csproj -c Release -- 2000 2
      - name: Verify package contents
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem ./artifacts/unity/SocketJack.Unity.*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected exactly one Unity package.' }
          ./tools/Verify-UnityPackage.ps1 -Package $packages[0].FullName
          $hash = (Get-FileHash $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($packages[0].Name)" | Set-Content ./artifacts/unity/SHA256SUMS -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: socketjack-unity-${{ github.sha }}
          path: artifacts/unity/*
          if-no-files-found: error
