<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>SocketJack application WebSocket demo</title>
<h1>SocketJack application WebSocket</h1>
<p>For local testing, use alice or bob with password demo.</p>
<form id="sign-in">
  <label>User <input name="username" value="alice" required></label>
  <label>Password <input name="password" type="password" required></label>
  <button>Sign in</button>
</form>
<form id="echo">
  <label>Message <input name="text" required></label>
  <button>Send</button>
</form>
<output id="result" role="status"></output>
<script type="module">
  import { SocketJackApplicationClient } from "/application.mjs";
  const client = new SocketJackApplicationClient("/app/socket");
  const result = document.querySelector("#result");
  function bind(selector, operation, fields) {
    document.querySelector(selector).addEventListener("submit", async event => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      try {
        const reply = await client.invoke(operation, Object.fromEntries(fields.map(name => [name, data.get(name)])));
        result.textContent = reply.text ?? "Signed in as " + reply.subject;
      } catch (error) {
        result.textContent = error.message;
      }
    });
  }
  bind("#sign-in", "session.signIn", ["username", "password"]);
  bind("#echo", "demo.echo", ["text"]);
</script>
</html>
